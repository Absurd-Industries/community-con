name: CI

# Deployment is handled by Cloudflare's Git integration, which runs
# `npm run build` then `npx wrangler deploy` against the root wrangler.jsonc.
# This workflow only guards the branch - it must not deploy as well, or the
# same commit would ship twice from two places.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Test API
        run: npm run test:api

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build
