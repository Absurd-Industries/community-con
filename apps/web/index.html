<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/images/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- This palette is light by design. "only light" opts out of Chromium's
         Auto Dark Theme, which otherwise inverts it on Android. -->
    <meta name="color-scheme" content="only light" />
    <meta name="theme-color" content="#FFFFFF" />
    <title>Community Con — IndiaFOSS 2026</title>
    <meta
      name="description"
      content="The flash lightning-talk lineup for IndiaFOSS 2026, chosen by the people in the room. Propose a talk, vote with your ticket, results at lunch."
    />

    <!-- Social share card. Regenerate the image with:
         node apps/web/scripts/og/render-og.mjs -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Community Con" />
    <meta property="og:title" content="Community Con — IndiaFOSS 2026" />
    <meta
      property="og:description"
      content="The flash lightning-talk lineup, chosen by the people in the room. Vote with your ticket."
    />
    <meta property="og:url" content="https://community-con.pages.dev/" />
    <meta property="og:image" content="https://community-con.pages.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Community Con, IndiaFOSS 2026. Lightning talks chosen by the room." />
    <meta property="og:locale" content="en_IN" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Community Con — IndiaFOSS 2026" />
    <meta
      name="twitter:description"
      content="The flash lightning-talk lineup, chosen by the people in the room. Vote with your ticket."
    />
    <meta name="twitter:image" content="https://community-con.pages.dev/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css" />
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
