<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/images/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- This palette is light by design. "only light" opts out of Chromium's
         Auto Dark Theme, which otherwise inverts it on Android. -->
    <meta name="color-scheme" content="only light" />
    <meta name="theme-color" content="#F0F0F0" />
    <title>Communi-Con at IndiaFOSS 2026</title>
    <meta
      name="description"
      content="Everyone has a shot at a 10 minute slot on our biggest stage. Propose a talk, vote with your ticket, and seven go up in Hall 1 at IndiaFOSS 2026."
    />

    <!-- Social share card. Regenerate the image with:
         node apps/web/scripts/og/render-og.mjs
         TODO: og:url and og:image still point at a placeholder domain. Swap
         both when the real hostname is decided. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Communi-Con" />
    <meta property="og:title" content="Communi-Con at IndiaFOSS 2026" />
    <meta
      property="og:description"
      content="Everyone has a shot at a 10 minute slot on our biggest stage. Propose a talk, vote with your ticket, seven go up in Hall 1."
    />
    <meta property="og:url" content="https://community-con.pages.dev/" />
    <meta property="og:image" content="https://community-con.pages.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Communi-Con at IndiaFOSS 2026. Seven lightning talks, chosen by the room."
    />
    <meta property="og:locale" content="en_IN" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Communi-Con at IndiaFOSS 2026" />
    <meta
      name="twitter:description"
      content="Everyone has a shot at a 10 minute slot on our biggest stage. Propose a talk, vote with your ticket, seven go up in Hall 1."
    />
    <meta name="twitter:image" content="https://community-con.pages.dev/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css" />
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
