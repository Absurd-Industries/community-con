<!doctype html>
<!--
  Source for the social share card. Rendered to apps/web/public/og-image.png by
  scripts/og/render-og.mjs (headless Chrome -> sharp). Edit here, then re-run:
      node apps/web/scripts/og/render-og.mjs
  Same tokens as the site: grey ground, white card, one black panel with the
  festival's maze motif, Inter.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #f0f0f0;
        font-family: 'Inter', system-ui, sans-serif;
        color: #1a1a1a;
      }

      .frame { display: flex; gap: 24px; width: 1200px; height: 630px; padding: 48px; }

      .card {
        flex: 1;
        display: flex;
        flex-direction: column;
        background: #ffffff;
        border: 1px solid rgba(26, 26, 26, 0.1);
        border-radius: 22px;
        padding: 48px 56px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 12px 32px -10px rgba(0, 0, 0, 0.12);
      }

      .lockup { display: flex; align-items: center; gap: 14px; }
      .lockup .wordmark { height: 30px; width: auto; }
      .lockup .rule { width: 1px; height: 22px; background: rgba(26, 26, 26, 0.18); }
      .lockup .name { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }

      h1 {
        margin-top: 26px;
        font-size: 56px;
        font-weight: 700;
        line-height: 1.06;
        letter-spacing: -0.04em;
        max-width: 15ch;
      }

      .tagline {
        margin-top: 20px;
        max-width: 34ch;
        font-size: 22px;
        line-height: 1.45;
        color: #4a4a4a;
      }

      .foot {
        margin-top: auto;
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 18px;
        color: #6b6b6b;
      }
      .dot { width: 5px; height: 5px; border-radius: 50%; background: #c4c4c4; }
      .foot .hall { color: #1a1a1a; font-weight: 600; }

      /* The one dark panel, as on the site - maze motif and all. */
      .panel {
        position: relative;
        overflow: hidden;
        width: 336px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        background: #1a1a1a;
        color: #ffffff;
        border-radius: 22px;
        padding: 48px 40px;
      }
      .panel .maze {
        position: absolute;
        inset: 0;
        background-color: #08B54D;
        opacity: 0.3;
        -webkit-mask-image: url('../../public/images/indiafoss-maze.webp');
        mask-image: url('../../public/images/indiafoss-maze.webp');
        -webkit-mask-size: cover;
        mask-size: cover;
        -webkit-mask-position: center bottom;
        mask-position: center bottom;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
      }
      .panel > *:not(.maze) { position: relative; }
      .panel .label {
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.55);
      }
      .panel .big {
        margin-top: 12px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 96px;
        font-weight: 600;
        line-height: 1;
        color: #08B54D;
      }
      .panel .sub { margin-top: 10px; font-size: 19px; color: rgba(255, 255, 255, 0.72); }
      .mark {
        margin-top: 40px;
        padding-top: 24px;
        border-top: 1px solid rgba(255, 255, 255, 0.16);
        font-size: 16px;
        line-height: 1.5;
        color: rgba(255, 255, 255, 0.7);
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="card">

          <span class="rule"></span>
          <span class="name">Communi-Con</span>
        </div>
        <h1>Everyone has a shot at a 10 minute slot on our biggest stage.</h1>
        <p class="tagline">
          Community members propose. Ticket-holders vote. Seven take the main stage.
        </p>
        <div class="foot">
          <span class="hall">Hall 1</span>
          <span class="dot"></span>
          <span>27 September 2026</span>
          <span class="dot"></span>
          <span>NIMHANS, Bengaluru</span>
        </div>
      </div>

      <div class="panel">
        <span class="maze"></span>
        <span class="label">Talks on stage</span>
        <span class="big">7</span>
        <span class="sub">10 minutes each, picked by the room</span>
        <div class="mark">IndiaFOSS 2026<br />FOSS United</div>
      </div>
    </div>
  </body>
</html>
