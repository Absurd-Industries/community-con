name = "community-con-api"
main = "src/index.ts"
compatibility_date = "2026-07-20"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "community-con"
# Replace with the id from `wrangler d1 create community-con`
database_id = "REPLACE_ME"
migrations_dir = "migrations"

[vars]
ALLOWED_ORIGIN = "https://community-con.pages.dev"
DEV_NO_AUTH = "false"
# Optional extra admins. The first synced user becomes admin even if this is unset.
# Comma-separated admin emails, e.g. "alice@example.com,bob@example.com"
# ADMIN_EMAIL = ""
